# WHEEL UP!: a tag like `v0.1.0`, a branch like `release/v0.1.0`, or running
# this workflow by hand with that version builds the game for Windows, macOS
# and Linux and publishes the three archives as that version's GitHub release,
# tagging it if it isn't yet. The binary carries everything it needs (fonts and
# songs are built in, kits are synthesised on first launch), so each archive
# is the game and its notes.
name: release

on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The version to publish, like v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            exe: wheelup.exe
          - os: macos-latest
            name: macos-arm64
            exe: wheelup
          - os: ubuntu-latest
            name: linux-x86_64
            exe: wheelup
    runs-on: ${{ matrix.os }}
    steps:
      - name: Version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "TAG=${INPUT_TAG:-${GITHUB_REF_NAME#release/}}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release --locked -p wheelup

      - name: Package
        shell: bash
        run: |
          dir="WHEEL-UP-${TAG}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.exe }}" "$dir/"
          cp README.md content/licenses.ron assets/fonts/OFL-*.txt "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$dir.zip" "$dir"
          elif [ "$RUNNER_OS" = macOS ]; then
            zip -r "$dir.zip" "$dir"
          else
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            WHEEL-UP-*.zip
            WHEEL-UP-*.tar.gz

  # One release, once all three are built.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "TAG=${INPUT_TAG:-${GITHUB_REF_NAME#release/}}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: WHEEL UP! ${{ env.TAG }}
          body: |
            Download the archive for your system, unzip it and run `wheelup` (`wheelup.exe` on Windows). Plug in a controller, or play on the keyboard.

            - **macOS**: the game isn't signed. The first time, right-click it and choose **Open**. Apple silicon only.
            - **Linux**: needs ALSA and udev, which desktops have.
          files: |
            WHEEL-UP-*.zip
            WHEEL-UP-*.tar.gz
          generate_release_notes: true
