name: Web (GitHub Pages)

# Publishes web/, the touch-screen mania version, to GitHub Pages.
# Regenerate its songs with: cargo run --release -p wheelup-cli -- web-export -o out,
# then encode out/*.wav to web/songs/*.mp3 and copy out/*.json beside them.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
